<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">EL FAHD — الفهد</title>
  <desc id="desc">Gold and black circular badge for مكتب الفهد لخدمات الدليفري</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E2A6"/>
      <stop offset="32%" stop-color="#E8C766"/>
      <stop offset="62%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8C6D18"/>
    </linearGradient>
    <radialGradient id="ink" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#241A12"/>
      <stop offset="100%" stop-color="#0B0806"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="#050403"/>
  <circle cx="512" cy="512" r="392" fill="url(#ink)"/>
  <circle cx="512" cy="512" r="392" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.9"/>
  <circle cx="512" cy="512" r="360" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.55"/>

  <!-- Panther silhouette: abstract leaping mark above the calligraphy -->
  <g fill="url(#gold)" opacity="0.95">
    <path d="M648 214c22-6 47 2 60 20 10 14 8 32-4 43-8 8-20 11-31 9l-30 27c-8 7-19 9-29 6l-26-9-42 24c-9 5-20 4-28-2l-18-14 39-25-37-7 36-30 40 6 20-22-33-3 32-24 31 8z"/>
    <path d="M314 312c30-18 66-20 96-4 12 7 21 18 30 29l34 10-12 21-30-6c-13 20-33 35-57 41-35 9-72-3-95-30l-12-14 44-15 24-24z" opacity="0.9"/>
  </g>

  <!-- Arabic wordmark -->
  <text x="512" y="640" text-anchor="middle" fill="url(#gold)"
        font-family="Aref Ruqaa" font-size="196" font-weight="700"
        letter-spacing="2">الفهد</text>

  <!-- English plate -->
  <g>
    <rect x="322" y="690" width="380" height="92" rx="14" fill="url(#gold)"/>
    <rect x="330" y="698" width="364" height="76" rx="10" fill="none" stroke="#0B0806" stroke-width="2" opacity="0.35"/>
    <text x="512" y="758" text-anchor="middle" fill="#0B0806"
          font-family="Roboto" font-size="60" font-weight="800" letter-spacing="8">ALFAHD</text>
  </g>

  <text x="512" y="836" text-anchor="middle" fill="#F7E2A6" opacity="0.85"
        font-family="Cairo" font-size="30" font-weight="600">مكتب الفهد لخدمات الدليفري</text>

  <g stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M300 868h88M636 868h88M360 892h304"/>
  </g>
  <g fill="url(#gold)" opacity="0.85">
    <path d="M512 180l12 22 22 12-22 12-12 22-12-22-22-12 22-12z"/>
  </g>
</svg>
